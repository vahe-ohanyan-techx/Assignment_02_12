<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Media Page</title>
</head>
<body>
    <h2>Standard Image</h2>
    <img src="https://www.shutterstock.com/image-photo/lake-tahoe-east-shore-beach-600nw-1038472942.jpg" alt="Standard Image" title="a Standard type of image">
    
        <h2>Responsive Images</h2>
        <picture>
            <source media="(max-width: 770px)"
            srcset="assets/istockphoto-1419410282-612x612.jpg">
            
            <source media="(max-width: 768px)" 
            srcset="assets/free-nature-images.jpg">
            
            <img src="https://www.bigfootdigital.co.uk/wp-content/uploads/2020/07/image-optimisation-scaled.jpg" height="400" width="500" title="Lake Image">
        </picture>
        
        <div>
        <video controls> <source src="https://youtu.be/-kenx1rQyZo?si=1RHsXskmVjz041MI"></video>
        
        <iframe width="560" height="315"
            src="https://www.youtube.com/embed/Bq4rmeIvJbs"

            frameborder="0"
            allowfullscreen>
        </iframe>
    </div>
    <!-- Google Map -->
